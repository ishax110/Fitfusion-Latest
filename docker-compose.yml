version: "3.9"

# ══════════════════════════════════════════════════════
#  FitFusion — Full Stack Docker Compose
#  Usage: docker-compose up --build
# ══════════════════════════════════════════════════════

services:

  # ── PostgreSQL Database ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: fitfusion-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-fitfusion}
      POSTGRES_USER:     ${POSTGRES_USER:-fitfusion_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitfusion_secure_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fitfusion_user} -d ${POSTGRES_DB:-fitfusion}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot Backend ──────────────────────────────
  backend:
    build:
      context: ./fitfusion-backend
      dockerfile: Dockerfile
    container_name: fitfusion-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      DB_URL:          jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fitfusion}
      DB_USERNAME:     ${POSTGRES_USER:-fitfusion_user}
      DB_PASSWORD:     ${POSTGRES_PASSWORD:-fitfusion_secure_pass}
      JWT_SECRET:      ${JWT_SECRET:-change-this-to-a-strong-random-secret-in-production}
      AI_SERVICE_URL:  http://ai-service:8000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/auth/register || true"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── FastAPI AI Service (Groq + ML predictor) ─────────
  ai-service:
    build:
      context: ./fitfusion-ai
      dockerfile: Dockerfile
    container_name: fitfusion-ai
    restart: unless-stopped
    depends_on:
      - mediapipe-service
    environment:
      GROQ_API_KEY:          ${GROQ_API_KEY}
      MEDIAPIPE_SERVICE_URL: http://mediapipe-service:8001
    ports:
      - "8000:8000"
    volumes:
      - ./fitfusion-ai/models:/app/models:ro

  # ── FastAPI MediaPipe Service (pose detection) ───────
  mediapipe-service:
    build:
      context: ./mediapipe
      dockerfile: Dockerfile
    container_name: fitfusion-mediapipe
    restart: unless-stopped
    ports:
      - "8001:8001"

  # ── React Frontend (Nginx) ───────────────────────────
  frontend:
    build:
      context: ./fitfusion-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: fitfusion-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
    driver: local
