[build]
  builder    = "DOCKERFILE"
  dockerfilePath = "Dockerfile"

[deploy]
  startCommand       = "java -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -jar app.jar"
  healthcheckPath    = "/api/auth/register"
  healthcheckTimeout = 120
  restartPolicyType  = "ON_FAILURE"
  restartPolicyMaxRetries = 3

[[services.envs]]
  name  = "PORT"
  value = "8080"
