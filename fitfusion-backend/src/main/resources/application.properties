spring.application.name=fitfusion-backend

server.port=8080

# PostgreSQL Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fitfusion}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET:This my self developed AI powered fitness Application}
jwt.expiration-ms=86400000

# FastAPI AI Service
ai.service.url=${AI_SERVICE_URL:http://127.0.0.1:8000}

# ── Multipart file upload (video tracking) ──────────────────────────────
# Allow videos up to 200 MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB

# ── Groq API key (passed as env var at runtime) ──────────────────────────
# Set GROQ_API_KEY in your environment before starting the FastAPI service
