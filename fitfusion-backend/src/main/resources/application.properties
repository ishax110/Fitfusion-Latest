spring.application.name=fitfusion-backend

# Railway sets PORT env var automatically
server.port=${PORT:8080}

# ── PostgreSQL Database ────────────────────────────────────────────────────
# Railway provides DATABASE_URL as: postgresql://user:pass@host:port/db
# Spring Boot needs JDBC format.
# Use JDBC_DATABASE_URL if set (add manually in Railway),
# otherwise fall back to DB_URL or local default.
spring.datasource.url=${JDBC_DATABASE_URL:${DB_URL:jdbc:postgresql://localhost:5432/fitfusion}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# ── JPA / Hibernate ────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── JWT ────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:ThisIsADefaultSecretThatMustBeChangedInProduction123!}
jwt.expiration-ms=86400000

# ── FastAPI AI Service ─────────────────────────────────────────────────────
ai.service.url=${AI_SERVICE_URL:http://127.0.0.1:8000}

# ── Multipart file upload ──────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB
